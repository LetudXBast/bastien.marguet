<form class="form-card" action="https://formsubmit.co/%62%61%73%74%2E%6D%61%72%67%75%65%74%40%67%6D%61%69%6C%2E%63%6F%6D" method="POST">
          <input type="hidden" name="_honey" value="">
          <input type="hidden" name="_next" value="https://letudxbast.github.io/bastien.marguet/merci.html">
          <input type="hidden" name="_captcha" value="false">

          <p class="meta">L’adresse e-mail et le message sont obligatoires. Le nom est facultatif.</p>
          <p id="contact-errors" class="form-error-summary" role="alert" hidden></p>
          <label for="contact-name">Nom (facultatif)
            <input type="text" id="contact-name" name="name" autocomplete="name" placeholder="Votre nom">
          </label>
          <label for="contact-email">Adresse e-mail (obligatoire)
            <input type="email" id="contact-email" name="email" autocomplete="email" placeholder="Votre adresse e-mail" aria-describedby="contact-email-error" required>
          </label>
          <p id="contact-email-error" class="field-error" hidden></p>
          <label for="contact-message">Message (obligatoire)
            <textarea id="contact-message" name="message" rows="6" placeholder="Votre projet, votre public et vos besoins…" aria-describedby="contact-message-error" required></textarea>
          </label>
          <p id="contact-message-error" class="field-error" hidden></p>
          <button type="submit" class="button">Envoyer le message</button>
        </form>
